[package]
name = "super-cass"
version = "0.1.0"
edition = "2021"

[features]
default = ["semantic-fastembed"]
semantic-fastembed = ["dep:fastembed"]

[dependencies]
anyhow = "1.0"
axum = "0.7"
base64 = "0.22"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "5.0"
fastembed = { version = "5.15.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"], optional = true }
hex = "0.4"
libc = "0.2"
notify = "6.1"
rusqlite = { version = "0.31", features = ["bundled", "chrono", "functions"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlite-vec = "=0.1.9"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
